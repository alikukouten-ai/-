<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>登録者一覧 / REGISTERED PARTICIPANTS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}

  :root{
    --gold:#ffd76a;--gold2:#ffb43a;--violet:#8b7cff;--blue:#5b6bff;
    --text:#e9edff;--muted:#8b93b8;--line:rgba(255,255,255,.09);
    --green:#6fe0a0;--red:#ff7b7b;
  }

  body{
    min-height:100vh;padding:40px 18px 70px;
    display:flex;justify-content:center;align-items:flex-start;
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(91,107,255,.24), transparent 70%),
      radial-gradient(700px 420px at 105% 105%, rgba(255,183,58,.08), transparent 70%),
      #070812;
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .container{width:100%;max-width:660px;display:flex;flex-direction:column;gap:16px}
  .hidden{display:none !important}

  header{text-align:center;margin-bottom:4px}
  .badge{
    display:inline-block;font-size:10.5px;letter-spacing:.2em;font-weight:700;
    padding:6px 15px;border-radius:999px;
    border:1px solid rgba(139,124,255,.45);
    color:#b3a9ff;background:rgba(139,124,255,.1);margin-bottom:16px;
  }
  h1{
    font-size:26px;letter-spacing:.06em;
    background:linear-gradient(120deg,#ffffff,#c9c2ff 55%,#8b7cff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .en-title{
    margin-top:7px;font-size:10.5px;letter-spacing:.3em;
    font-weight:600;color:#7d86ad;
  }

  .panel{
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border:1px solid var(--line);border-radius:20px;padding:20px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 22px 44px -26px rgba(0,0,0,.95);
  }
  .panel h2{
    font-size:12.5px;letter-spacing:.08em;font-weight:700;margin-bottom:14px;
    display:flex;align-items:baseline;gap:8px;
  }
  .panel h2 span{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat-card{
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid var(--line);border-radius:15px;padding:15px 12px;
    text-align:center;transition:border-color .25s,transform .25s;
  }
  .stat-card:hover{border-color:rgba(139,124,255,.4);transform:translateY(-2px)}
  .stat-value{
    font-size:23px;font-weight:800;letter-spacing:.02em;line-height:1.2;
    background:linear-gradient(135deg,#ffffff,#b3a9ff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;
  }
  .stat-card.gold .stat-value{
    background:linear-gradient(135deg,#ffe9a8,var(--gold2));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .stat-card.green .stat-value{
    background:linear-gradient(135deg,#b6ffd8,var(--green));
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .stat-label{
    margin-top:7px;font-size:9.5px;letter-spacing:.1em;
    font-weight:700;color:var(--muted);line-height:1.45;
  }
  .stat-label em{display:block;font-style:normal;font-size:8.5px;letter-spacing:.14em;color:#5f678a}

  .toolbar{display:flex;flex-direction:column;gap:12px}
  .search-box{position:relative}
  .search-box input{
    width:100%;padding:13px 42px 13px 15px;border-radius:12px;
    border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);
    font-family:inherit;font-size:13.5px;outline:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .search-box input::placeholder{color:#5b6386}
  .search-box input:focus{
    border-color:rgba(139,124,255,.8);
    box-shadow:0 0 0 3px rgba(139,124,255,.16);
  }
  .search-box .icon{
    position:absolute;right:15px;top:50%;transform:translateY(-50%);
    color:#5b6386;font-size:14px;pointer-events:none;
  }

  .btn-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .btn{
    padding:12px 10px;border:none;border-radius:12px;
    font-family:inherit;font-size:11.5px;font-weight:700;
    letter-spacing:.04em;cursor:pointer;line-height:1.35;
    transition:transform .16s,box-shadow .16s,background .16s,
               border-color .16s,color .16s;
  }
  .btn:active{transform:scale(.975)}
  .btn-ghost{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:#c9cfec;
  }
  .btn-ghost:hover{
    background:rgba(139,124,255,.14);
    border-color:rgba(139,124,255,.5);color:#d8d3ff;
  }
  .btn-danger{
    background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:#ff9d9d;
  }
  .btn-danger:hover{
    background:rgba(255,90,90,.18);
    border-color:rgba(255,90,90,.6);color:#ffbcbc;
  }

  .account{
    border:1px solid var(--line);border-radius:15px;
    background:rgba(255,255,255,.032);margin-bottom:10px;overflow:hidden;
    transition:border-color .25s,background .25s;animation:slideIn .32s ease;
  }
  .account:last-child{margin-bottom:0}
  .account:hover{border-color:rgba(139,124,255,.35)}
  .account.is-session{border-color:rgba(111,224,160,.45);background:rgba(111,224,160,.05)}

  @keyframes slideIn{
    from{opacity:0;transform:translateY(-6px)}
    to{opacity:1;transform:none}
  }

  .acc-head{display:flex;align-items:center;gap:10px;padding:14px 15px}
  .acc-avatar{
    width:34px;height:34px;flex:0 0 34px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--violet),var(--blue));
    font-size:14px;font-weight:800;color:#fff;text-transform:uppercase;
  }
  .account.is-session .acc-avatar{
    background:linear-gradient(135deg,#3fd98a,#22a866);color:#04220f;
  }

  .acc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .acc-email{
    font-size:13px;font-weight:700;letter-spacing:.01em;
    color:var(--text);word-break:break-all;line-height:1.35;
  }
  .acc-sub{
    display:flex;flex-wrap:wrap;align-items:center;gap:7px;
    font-size:10px;letter-spacing:.06em;color:var(--muted);font-weight:600;
  }

  .tag{
    display:inline-block;font-size:9px;letter-spacing:.12em;font-weight:800;
    padding:3px 8px;border-radius:999px;
    background:rgba(111,224,160,.16);
    border:1px solid rgba(111,224,160,.4);color:var(--green);
  }
  .tag.win{
    background:rgba(255,183,58,.16);
    border-color:rgba(255,215,106,.5);color:var(--gold);
  }
  .tag.done{
    background:rgba(255,255,255,.05);
    border-color:var(--line);color:#767e9f;
  }

  .acc-toggle{
    flex:0 0 auto;width:32px;height:32px;border-radius:10px;
    border:1px solid var(--line);background:rgba(0,0,0,.25);
    color:var(--muted);font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .18s,color .18s,transform .3s;
  }
  .acc-toggle:hover{background:rgba(139,124,255,.16);color:#d8d3ff}
  .acc-toggle.open{transform:rotate(180deg)}

  .acc-meta{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border-top:1px solid var(--line);
  }
  .meta-cell{background:#0a0b16;padding:11px 8px;text-align:center}
  .meta-label{
    display:block;font-size:8.5px;letter-spacing:.1em;
    font-weight:700;color:#5f678a;margin-bottom:5px;line-height:1.3;
  }
  .meta-value{font-size:15px;font-weight:800;color:var(--text);letter-spacing:.02em}
  .meta-value.gold{color:var(--gold)}
  .meta-value.muted{color:#767e9f;font-size:12px;font-weight:700}

  .acc-history{
    padding:12px 15px 15px;border-top:1px solid var(--line);
    background:rgba(0,0,0,.22);
  }
  .hist-title{
    font-size:9.5px;letter-spacing:.14em;font-weight:800;
    color:#5f678a;margin-bottom:9px;
  }
  .hist-list{display:flex;flex-wrap:wrap;gap:7px}
  .hist-chip{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;padding:6px 11px;border-radius:9px;
    background:rgba(255,255,255,.045);border:1px solid var(--line);
    color:#a8b0d0;letter-spacing:.03em;
  }
  .hist-chip.win{
    background:rgba(255,183,58,.14);
    border-color:rgba(255,215,106,.5);color:var(--gold);
  }
  .hist-chip .num{color:#5f678a;font-weight:800}
  .hist-chip.win .num{color:rgba(255,215,106,.7)}
  .hist-none{font-size:11.5px;color:#666e90;letter-spacing:.03em}

  .empty-state{text-align:center;padding:34px 18px}
  .empty-state .emoji{font-size:38px;opacity:.5;margin-bottom:12px}
  .empty-state p{font-size:12.5px;line-height:1.8;color:#767e9f;letter-spacing:.02em}

  .loading{text-align:center;padding:34px 18px;color:#767e9f;font-size:12.5px}
  .loading .spinner{
    width:28px;height:28px;margin:0 auto 14px;
    border:3px solid rgba(139,124,255,.2);
    border-top-color:var(--violet);
    border-radius:50%;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .back-link{
    display:block;text-align:center;font-size:11.5px;font-weight:700;
    letter-spacing:.08em;color:#b3a9ff;text-decoration:none;
    padding:14px;border-radius:14px;
    border:1px solid rgba(139,124,255,.3);background:rgba(139,124,255,.08);
    transition:background .2s,border-color .2s,transform .2s;
  }
  .back-link:hover{
    background:rgba(139,124,255,.16);
    border-color:rgba(139,124,255,.6);transform:translateY(-1px);
  }

  footer{
    text-align:center;font-size:10px;letter-spacing:.16em;
    color:#4e5578;margin-top:2px;
  }

  .toast{
    position:fixed;left:50%;bottom:28px;
    transform:translateX(-50%) translateY(20px);
    padding:12px 20px;border-radius:12px;
    background:rgba(20,22,38,.96);
    border:1px solid rgba(139,124,255,.5);
    color:#d8d3ff;font-size:12px;font-weight:700;letter-spacing:.04em;
    box-shadow:0 16px 34px -12px rgba(0,0,0,.9);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:520px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .btn-row{grid-template-columns:1fr 1fr}
    .btn-row .btn:first-child{grid-column:1 / -1}
    h1{font-size:22px}
  }
</style>
</head>
<body>

<div class="container">

  <header>
    <div class="badge">ADMIN VIEWER</div>
    <h1>登録者一覧</h1>
    <p class="en-title">REGISTERED PARTICIPANTS</p>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="statAccounts">—</div>
      <div class="stat-label">登録者<em>ACCOUNTS</em></div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="statDraws">—</div>
      <div class="stat-label">総抽選数<em>TOTAL DRAWS</em></div>
    </div>
    <div class="stat-card green">
      <div class="stat-value" id="statWins">—</div>
      <div class="stat-label">的中数<em>JACKPOTS</em></div>
    </div>
    <div class="stat-card gold">
      <div class="stat-value" id="statLeft">—</div>
      <div class="stat-label">残り回数<em>DRAWS LEFT</em></div>
    </div>
  </div>

  <div class="panel toolbar">
    <div class="search-box">
      <input type="text" id="searchInput"
        placeholder="メールアドレスで検索 / Search by email"
        autocomplete="off" spellcheck="false">
      <span class="icon">🔍</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="refreshBtn" type="button">
        更新<br>REFRESH
      </button>
      <button class="btn btn-ghost" id="csvBtn" type="button">
        CSV出力<br>EXPORT CSV
      </button>
      <button class="btn btn-danger" id="clearBtn" type="button">
        全削除<br>CLEAR ALL
      </button>
    </div>
  </div>

  <div class="panel">
    <h2>登録アカウント <span>REGISTERED ACCOUNTS</span></h2>
    <div id="loading" class="loading">
      <div class="spinner"></div>
      読み込み中… / Loading…
    </div>
    <div id="list"></div>
    <div id="emptyState" class="empty-state hidden">
      <div class="emoji">📭</div>
      <p>登録されたメールアドレスはありません<br>
         No registered email addresses found</p>
    </div>
  </div>

  <a class="back-link" href="index.html">
    ← 抽選ページへ戻る / BACK TO GACHA
  </a>

  <footer>ADMIN PANEL — 登録者管理</footer>
</div>

<div class="toast" id="toast"></div>

<script>
  /* ============================================
     配置 / CONFIG —— 与游戏页面保持一致
     ============================================ */
  const JSONBIN_BIN_ID     = '6ac18d5e7e19fe510f393b50';
  const JSONBIN_MASTER_KEY = '$2a$10$gEhLd0BgQbN5nfL2k3b00unXTem2nwPahOFvsS.dodACa5OPAu1Ja';
  const JSONBIN_URL        = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;
  const TOTAL_DRAWS        = 5;

  /* ============================================
     状态 / STATE
     ============================================ */
  let accounts = {};
  let query    = '';

  /* ============================================
     元素 / ELEMENTS
     ============================================ */
  const listEl      = document.getElementById('list');
  const emptyState  = document.getElementById('emptyState');
  const loadingEl   = document.getElementById('loading');
  const searchInput = document.getElementById('searchInput');
  const refreshBtn  = document.getElementById('refreshBtn');
  const csvBtn      = document.getElementById('csvBtn');
  const clearBtn    = document.getElementById('clearBtn');
  const toastEl     = document.getElementById('toast');

  const statAccounts = document.getElementById('statAccounts');
  const statDraws    = document.getElementById('statDraws');
  const statWins     = document.getElementById('statWins');
  const statLeft     = document.getElementById('statLeft');

  /* ============================================
     工具 / UTILS
     ============================================ */
  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  function formatDate(ts) {
    if (!ts) return '—';
    try {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return '—';
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ` +
             `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch (e) { return '—'; }
  }

  function initialOf(email) {
    return (email || '?').charAt(0).toUpperCase();
  }

  /* ============================================
     云读取 / CLOUD LOAD
     ============================================ */
  async function loadFromCloud() {
    loadingEl.classList.remove('hidden');
    listEl.innerHTML = '';
    emptyState.classList.add('hidden');

    try {
      const res = await fetch(`${JSONBIN_URL}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_MASTER_KEY }
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const data = await res.json();
      accounts = (data && data.record) || {};

      if (typeof accounts !== 'object' || Array.isArray(accounts)) {
        accounts = {};
      }

      loadingEl.classList.add('hidden');
      render();

    } catch (e) {
      console.error(e);
      loadingEl.classList.add('hidden');
      listEl.innerHTML = '';
      emptyState.classList.remove('hidden');
      emptyState.querySelector('p').innerHTML =
        '⚠️ クラウドへの接続に失敗しました<br>' +
        'Failed to load data from cloud.<br>' +
        '<span style="font-size:11px;color:#5f678a">' +
        'Bin ID と Master Key を確認してください。<br>' +
        'Please check your Bin ID and Master Key.' +
        '</span>';
      showToast('接続エラー / Connection error');
    }
  }

  /* ============================================
     数据构建 / BUILD DATA
     ============================================ */
  function buildList() {
    return Object.keys(accounts).map(email => {
      const a = accounts[email] || {};
      const history = Array.isArray(a.history) ? a.history : [];
      const wins = history.filter(h => h && h.win).length;

      return {
        email,
        drawsLeft: typeof a.drawsLeft === 'number' ? a.drawsLeft : TOTAL_DRAWS,
        drawCount: typeof a.drawCount === 'number' ? a.drawCount : history.length,
        registeredAt: typeof a.registeredAt === 'number' ? a.registeredAt : null,
        updatedAt: typeof a.updatedAt === 'number' ? a.updatedAt : null,
        history,
        wins
      };
    });
  }

  function sortList(list) {
    return list.sort((a, b) => {
      const ta = a.updatedAt || a.registeredAt || 0;
      const tb = b.updatedAt || b.registeredAt || 0;
      return tb - ta;
    });
  }

  /* ============================================
     渲染 / RENDER
     ============================================ */
  function render() {
    const all = sortList(buildList());

    const totalDraws = all.reduce((s, a) => s + a.drawCount, 0);
    const totalWins  = all.reduce((s, a) => s + a.wins, 0);
    const totalLeft  = all.reduce((s, a) => s + a.drawsLeft, 0);

    statAccounts.textContent = all.length;
    statDraws.textContent    = totalDraws;
    statWins.textContent     = totalWins;
    statLeft.textContent     = totalLeft;

    const filtered = query
      ? all.filter(a => a.email.toLowerCase().includes(query))
      : all;

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      emptyState.classList.remove('hidden');
      if (all.length > 0 && query) {
        emptyState.querySelector('p').innerHTML =
          '検索条件に一致する登録者がいません<br>' +
          'No participants match your search';
      } else {
        emptyState.querySelector('p').innerHTML =
          '登録されたメールアドレスはありません<br>' +
          'No registered email addresses found';
      }
      return;
    }

    emptyState.classList.add('hidden');
    filtered.forEach(acc => listEl.appendChild(createAccountCard(acc)));
  }

  /* ============================================
     卡片 / ACCOUNT CARD
     ============================================ */
  function createAccountCard(acc) {
    const card = document.createElement('div');
    card.className = 'account';

    const head = document.createElement('div');
    head.className = 'acc-head';

    const avatar = document.createElement('div');
    avatar.className = 'acc-avatar';
    avatar.textContent = initialOf(acc.email);

    const main = document.createElement('div');
    main.className = 'acc-main';

    const emailEl = document.createElement('div');
    emailEl.className = 'acc-email';
    emailEl.textContent = acc.email;

    const sub = document.createElement('div');
    sub.className = 'acc-sub';

    if (acc.wins > 0) {
      const t = document.createElement('span');
      t.className = 'tag win';
      t.textContent = '的中あり / WINNER';
      sub.appendChild(t);
    }

    if (acc.drawsLeft <= 0) {
      const t = document.createElement('span');
      t.className = 'tag done';
      t.textContent = '完走 / COMPLETED';
      sub.appendChild(t);
    }

    const timeEl = document.createElement('span');
    timeEl.textContent = '登録 / REG: ' + formatDate(acc.registeredAt);
    sub.appendChild(timeEl);

    main.appendChild(emailEl);
    main.appendChild(sub);

    const toggle = document.createElement('button');
    toggle.className = 'acc-toggle';
    toggle.type = 'button';
    toggle.textContent = '▼';
    toggle.setAttribute('aria-label', 'Toggle history');

    head.appendChild(avatar);
    head.appendChild(main);
    head.appendChild(toggle);

    const meta = document.createElement('div');
    meta.className = 'acc-meta';

    meta.appendChild(makeMetaCell('残り回数', 'DRAWS LEFT',
      acc.drawsLeft, acc.drawsLeft > 0 ? 'gold' : 'muted'));
    meta.appendChild(makeMetaCell('抽選回数', 'DRAWS', acc.drawCount, ''));
    meta.appendChild(makeMetaCell('的中数', 'WINS',
      acc.wins, acc.wins > 0 ? 'gold' : 'muted'));

    const histWrap = document.createElement('div');
    histWrap.className = 'acc-history hidden';

    const histTitle = document.createElement('div');
    histTitle.className = 'hist-title';
    histTitle.textContent = '抽選履歴 / DRAW HISTORY';
    histWrap.appendChild(histTitle);

    if (acc.history.length === 0) {
      const none = document.createElement('div');
      none.className = 'hist-none';
      none.textContent = 'まだ抽選していません / No draws yet';
      histWrap.appendChild(none);
    } else {
      const list = document.createElement('div');
      list.className = 'hist-list';

      acc.history.forEach(h => {
        const chip = document.createElement('span');
        chip.className = 'hist-chip' + (h && h.win ? ' win' : '');

        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = '#' + (h && h.index != null ? h.index : '?');

        const txt = document.createElement('span');
        txt.textContent = h && h.win ? '🏆 JACKPOT' : '✖ NO WIN';

        chip.appendChild(num);
        chip.appendChild(txt);
        list.appendChild(chip);
      });

      histWrap.appendChild(list);
    }

    toggle.addEventListener('click', () => {
      const isOpen = !histWrap.classList.contains('hidden');
      histWrap.classList.toggle('hidden', isOpen);
      toggle.classList.toggle('open', !isOpen);
    });

    head.addEventListener('click', (e) => {
      if (e.target === toggle) return;
      toggle.click();
    });

    card.appendChild(head);
    card.appendChild(meta);
    card.appendChild(histWrap);
    return card;
  }

  function makeMetaCell(labelJp, labelEn, value, valueClass) {
    const cell = document.createElement('div');
    cell.className = 'meta-cell';

    const label = document.createElement('span');
    label.className = 'meta-label';
    label.innerHTML = labelJp + '<br>' + labelEn;

    const val = document.createElement('span');
    val.className = 'meta-value' + (valueClass ? ' ' + valueClass : '');
    val.textContent = value;

    cell.appendChild(label);
    cell.appendChild(val);
    return cell;
  }

  /* ============================================
     CSV 导出 / EXPORT CSV
     ============================================ */
  function exportCSV() {
    const list = sortList(buildList());

    if (list.length === 0) {
      showToast('出力するデータがありません / No data to export');
      return;
    }

    const header = ['Email','Draws Left','Total Draws','Wins','Registered At','History'];
    const rows = list.map(a => {
      const hist = a.history
        .map(h => `#${h && h.index != null ? h.index : '?'}=` +
                  (h && h.win ? 'JACKPOT' : 'NO WIN'))
        .join('; ');
      return [a.email, a.drawsLeft, a.drawCount, a.wins,
              formatDate(a.registeredAt), hist];
    });

    const escape = v => '"' + String(v).replace(/"/g, '""') + '"';
    const csv = [header, ...rows].map(r => r.map(escape).join(',')).join('\r\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');

    a.href = url;
    a.download = `gacha-participants-${stamp}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    showToast('CSVを出力しました / CSV exported');
  }

  /* ============================================
     全削除 / CLEAR ALL
     ============================================ */
  async function clearAll() {
    const count = Object.keys(accounts).length;
    if (count === 0) {
      showToast('削除するデータがありません / Nothing to clear');
      return;
    }

    const ok = confirm(
      `クラウド上の登録者データをすべて削除しますか？\n` +
      `${count} 件のアカウントが削除されます。\n\n` +
      `Delete ALL participant data from the cloud?\n` +
      `${count} account(s) will be removed.\n\n` +
      `この操作は取り消せません / This cannot be undone.`
    );
    if (!ok) return;

    try {
      await fetch(JSONBIN_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_MASTER_KEY
        },
        body: JSON.stringify({})
      });
      await loadFromCloud();
      showToast('すべてのデータを削除しました / All data cleared');
    } catch (e) {
      console.error(e);
      showToast('削除に失敗しました / Failed to clear');
    }
  }

  /* ============================================
     事件绑定 / EVENTS
     ============================================ */
  searchInput.addEventListener('input', () => {
    query = searchInput.value.trim().toLowerCase();
    render();
  });

  refreshBtn.addEventListener('click', async () => {
    await loadFromCloud();
    showToast('最新のデータを読み込みました / Refreshed');
  });

  csvBtn.addEventListener('click', exportCSV);
  clearBtn.addEventListener('click', clearAll);

  /* 自动刷新：每 30 秒 */
  setInterval(loadFromCloud, 30000);

  /* ============================================
     初始化 / INIT
     ============================================ */
  loadFromCloud();
</script>
